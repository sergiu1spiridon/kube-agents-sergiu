name: Manual E2E Test Runner

on:
  workflow_dispatch:
    inputs:
      test_environment:
        description: "Target test environment from e2e_config.yaml"
        required: true
        default: "cluster-e2e"
        type: choice
        options:
          - "cluster-e2e"
          - "audit-e2e"
          - "gchat-e2e"
          - "all"
      stockout_scenarios:
        description: "Stockout scenarios ('04' for fast smoke, 'all' for full matrix)"
        required: false
        default: "04"
        type: string
      rebuild_operator:
        description: "Rebuild operator from source (opt-in)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  run-e2e:
    name: Run E2E (${{ inputs.test_environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python Environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install Python Dependencies
        run: ./scripts/release/install_e2e_deps.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || '' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || '' }}
          credentials_json: ${{ secrets.GCP_SA_KEY || '' }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "579.0.0"
          install_components: "beta,gke-gcloud-auth-plugin"

      - name: Connect to GKE & Configure Docker
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
        run: |
          echo "Connecting to GKE cluster ${GKE_CLUSTER_NAME} in ${GCP_REGION} (${GCP_PROJECT_ID})..."
          gcloud container clusters get-credentials "${GKE_CLUSTER_NAME}" --location "${GCP_REGION}" --project "${GCP_PROJECT_ID}"
          echo "Configuring Docker authentication for Artifact Registry (${GCP_REGION}-docker.pkg.dev)..."
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet || true

      - name: Execute E2E Tests
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          AGENT_NAMESPACE: ${{ vars.AGENT_NAMESPACE || 'kubeagents-system' }}
          REGISTRY: ${{ vars.REGISTRY || vars.REGISTRY_PREFIX || (vars.GCP_PROJECT_ID && format('{0}-docker.pkg.dev/{1}/kube-agents', vars.GCP_REGION || 'us-east4', vars.GCP_PROJECT_ID)) || '' }}
          GITHUB_ORG: ${{ vars.GH_ORG || 'test-org-kube-agent' }}
          GITHUB_REPO: ${{ vars.GH_REPO || 'test-org-kube-agent/agents-repo' }}
          STOCKOUT_SCENARIOS: ${{ inputs.stockout_scenarios }}
          REBUILD_OPERATOR: ${{ inputs.rebuild_operator }}
          CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
          E2E_CHAT_CLIENT_ID: ${{ secrets.E2E_CHAT_CLIENT_ID }}
          E2E_CHAT_CLIENT_SECRET: ${{ secrets.E2E_CHAT_CLIENT_SECRET }}
          E2E_CHAT_REFRESH_TOKEN: ${{ secrets.E2E_CHAT_REFRESH_TOKEN }}
          CHAT_SPACE_ID: ${{ secrets.E2E_CHAT_SPACE_ID }}
        run: |
          TARGET_ENV="${{ inputs.test_environment }}"
          if [ "$TARGET_ENV" = "all" ]; then
            python3 scripts/release/execute_e2e_tests.py
          else
            python3 scripts/release/execute_e2e_tests.py --env "$TARGET_ENV"
          fi
