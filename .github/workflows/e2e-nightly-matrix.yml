name: E2E Nightly Full Matrix

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      stockout_scenarios:
        description: "Stockout scenario filter ('all' or comma-separated numbers, e.g. '01,02,04')"
        required: false
        default: "all"
        type: string
      target_environment:
        description: "Target deployment environment"
        required: false
        default: "autopush"
        type: string

concurrency:
  group: e2e-nightly-matrix
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  run-full-e2e-matrix:
    name: Execute Full E2E Test Matrix
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || 'autopush' }}
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python Environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: ./scripts/release/install_e2e_deps.sh

      - name: Authenticate to Google Cloud via Workload Identity Federation (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "579.0.0"
          install_components: "beta,gke-gcloud-auth-plugin"

      - name: Connect to GKE & Verify Readiness
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
        run: ./scripts/release/wait_for_gke_readiness.sh

      - name: Execute Full E2E Matrix (All Scenarios & Fleet Audit Streams)
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          GITHUB_ORG: ${{ vars.GH_ORG || vars.GITHUB_ORG || 'test-org-kube-agent' }}
          GITHUB_REPO: ${{ vars.GH_REPO || vars.GITHUB_REPO || 'test-org-kube-agent/agents-repo-2' }}
          STOCKOUT_SCENARIOS: ${{ inputs.stockout_scenarios || 'all' }}
          CHAT_TOPIC_NAME: ${{ vars.CHAT_TOPIC_NAME }}
          E2E_CHAT_CLIENT_ID: ${{ secrets.E2E_CHAT_CLIENT_ID }}
          E2E_CHAT_CLIENT_SECRET: ${{ secrets.E2E_CHAT_CLIENT_SECRET }}
          E2E_CHAT_REFRESH_TOKEN: ${{ secrets.E2E_CHAT_REFRESH_TOKEN }}
          CHAT_SPACE_ID: ${{ secrets.E2E_CHAT_SPACE_ID }}
        run: make test-e2e
